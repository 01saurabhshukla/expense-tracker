# Frontend: test on every push/PR that touches it; build and deploy to EC2
# from main. Runs only when frontend files change (DEPLOYMENT.md).
name: Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'docs/deploy/deploy-frontend.sh'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Test runs on other branches cancel older ones; deploys from main queue
    # up and are never cancelled half-way.
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # Built here, on GitHub's machine, never on the 1 GB server.
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          DEPLOY_SSH_KEY_FILE=~/.ssh/deploy_key docs/deploy/deploy-frontend.sh
