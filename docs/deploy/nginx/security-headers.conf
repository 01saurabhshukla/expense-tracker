# Security headers for every response of the expense tracker.
# Installed as /etc/nginx/snippets/expense-security-headers.conf and
# `include`d in each server AND in each location that sets its own headers:
# nginx drops ALL inherited add_header lines in a block that has any
# add_header of its own (see DEPLOYMENT.md, "nginx in detail").

# Browsers must use HTTPS for this name for a year, even if someone types http://.
add_header Strict-Transport-Security "max-age=31536000" always;
# No other site may show these pages inside a frame (clickjacking).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Files are what their Content-Type says; no guessing (MIME sniffing).
add_header X-Content-Type-Options "nosniff" always;
# Other sites see only our origin in Referer, never full URLs with ids.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app needs no camera, microphone, location or payment APIs.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
