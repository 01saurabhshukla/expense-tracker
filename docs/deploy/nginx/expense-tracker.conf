# nginx for the expense tracker on one EC2 machine (docs/DEPLOYMENT.md).
# Installed as /etc/nginx/sites-available/expense-tracker (+ a symlink in
# sites-enabled). Two names, one certificate:
#   saurabh-shukla.duckdns.org      → the website (static files)
#   api.saurabh-shukla.duckdns.org  → the Node API on 127.0.0.1:4000
# Both are under saurabh-shukla.duckdns.org, so browsers treat them as the
# same site and the SameSite=Lax refresh cookie works (D34).

# ---------------------------------------------------------------------------
# 1. Anything else (scanners using the bare IP, unknown names): no answer.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;   # TLS: refuse without sending any certificate
    return 444;                # HTTP: close the connection, send nothing
}

# ---------------------------------------------------------------------------
# 2. Port 80 for our two names: certificate renewals, then off to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name saurabh-shukla.duckdns.org api.saurabh-shukla.duckdns.org;

    # Let's Encrypt checks we own the names by fetching a file from here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Shared TLS settings for the two HTTPS servers below.
# ---------------------------------------------------------------------------
ssl_certificate     /etc/letsencrypt/live/saurabh-shukla.duckdns.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/saurabh-shukla.duckdns.org/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:expense_tls:5m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------------------------------------------------------------------------
# 3. The website: the built React app (frontend/dist), served as files.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name saurabh-shukla.duckdns.org;

    # A symlink to the current release folder; a deploy uploads a new
    # folder and switches the link, so visitors never see half a deploy.
    root /var/www/expense-tracker/current;
    index index.html;

    include snippets/expense-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed file names (index-C9YIcoec.js): their content never changes,
    # so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/expense-security-headers.conf;
        try_files $uri =404;
    }

    # index.html names the current asset files: always ask for a fresh one,
    # so a new deploy shows up on the next visit.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/expense-security-headers.conf;
    }

    # React Router pages (/transactions, /uploads/123) are not files: serve
    # index.html and let the app pick the page.
    location / {
        try_files $uri /index.html;
    }
}

# ---------------------------------------------------------------------------
# 4. The API: everything is passed to Node on 127.0.0.1:4000.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.saurabh-shukla.duckdns.org;

    include snippets/expense-security-headers.conf;

    # The app accepts 10 MB statements; anything bigger is refused here,
    # before a single byte reaches Node.
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Who the visitor really is (Express reads these: TRUST_PROXY=loopback).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Stream uploads to Node as they arrive (it checks size, type and
        # auth while streaming) instead of nginx saving them first.
        proxy_request_buffering off;

        # Slow mobile uploads and big CSV/PDF exports.
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
